version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: pos_mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - pos_network

  node_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos_node_api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/pos_database
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - pos_network

volumes:
  mongo_data:

networks:
  pos_network:
    driver: bridge
